default_environment: dev
project_id: 01a03876-4e71-75b2-bab2-74674b82b186
environments:
- name: dev
- name: staging
- name: prod
plugins:
  loaders:
  - name: target-postgres
    variant: matatika
    pip_url: git+https://github.com/Matatika/pipelinewise-target-postgres@v0.2.0
  transformers:
  - name: dbt
    variant: dbt-labs
    pip_url: dbt-core~=1.7.0 dbt-postgres~=1.7.0 dbt-snowflake~=1.7.0 dbt-bigquery~=1.7.0 certifi==2025.1.31
